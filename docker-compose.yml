services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodapp_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/tsconfig.json:/app/tsconfig.json:delegated
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - foodapp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodapp_backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src:delegated
      - ./backend/prisma:/app/prisma:delegated
      - ./backend/.env:/app/.env:delegated
      - ./backend/uploads:/app/uploads
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
    depends_on:
      - db
    networks:
      - foodapp-network

  db:
    image: postgres:16
    container_name: foodapp_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - foodapp-network

volumes:
  postgres_data:

networks:
  foodapp-network:
    driver: bridge